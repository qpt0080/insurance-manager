<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>무진</title>
  <meta name="theme-color" content="#3B5BDB">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // 자동 분기: 설계사 코드가 저장돼 있으면 뷰어로, 아니면 관리자 로그인으로.
    // (설계사가 코드 없이 들어오면 viewer가 코드 입력란을 직접 보여줌)
    (function(){
      var token = null;
      try { token = localStorage.getItem('mujinViewerToken'); } catch(e){}
      // 링크에 token이 붙어 들어온 경우 그대로 뷰어에 전달
      var m = location.search.match(/[?&]token=([^&]+)/i);
      if (m) { location.replace('viewer.html' + location.search); return; }
      location.replace(token ? 'viewer.html' : 'admin.html');
    })();
  </script>
  <style>
    body{font-family:-apple-system,'Pretendard',sans-serif;background:#F4F5F8;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;color:#9AA0AA;font-size:13px;}
  </style>
</head>

      addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
    }

</html>
