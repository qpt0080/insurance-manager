function renderViewerCommissions(parentEl) {
  if (!commissionsCache.length) return;

  const allItems = [];
  commissionsCache.forEach(d => {
    (d.items||[]).forEach(item => {
      allItems.push({...item, _year:d.year, _month:d.month});
    });
  });
  if (!allItems.length) return;

  const pending   = allItems.filter(i=>i.status==='pending').sort((a,b)=>(a.expectedPayDate||'').localeCompare(b.expectedPayDate||''));
  const paid      = allItems.filter(i=>i.status==='paid').sort((a,b)=>(b.expectedPayDate||'').localeCompare(a.expectedPayDate||''));
  const cancelled = allItems.filter(i=>i.status==='cancelled');

  const typeLabel  = {basic_comm:'수수료',award_next_month:'익월시상',award_13th:'13회차시상',award_consecutive:'연속시상'};
  const typeBadge  = {basic_comm:'var(--accent)',award_next_month:'var(--green)',award_13th:'var(--amber)',award_consecutive:'var(--purple)'};

  function itemHtml(item) {
    const color = item.status==='paid'?'var(--green)':item.status==='cancelled'?'var(--red)':'var(--accent)';
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="min-width:0;">
        <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:3px;">
          <span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:${typeBadge[item.type]||'var(--accent)'};color:#fff;">${typeLabel[item.type]||item.type}</span>
          <span style="font-size:12px;font-weight:600;">${escHtml(item.label||'')}</span>
        </div>
        <div style="font-size:11px;color:var(--text3);">
          ${item._year}년 ${item._month}월 실적
          ${item.retention ? ` · ${item.retention}회차 유지 조건` : ''}
        </div>
        <div style="font-size:11px;color:var(--text3);">${item.expectedPayDate||''}</div>
      </div>
      <div style="font-size:15px;font-weight:900;color:${color};flex-shrink:0;padding-left:10px;">
        ${item.goldReward?'금 '+item.goldReward:Math.round((item.amount||0)/10000)+'만원'}
      </div>
    </div>`;
  }

  const section = document.createElement('div');

  if (pending.length) {
    const pendingTotal = pending.reduce((s,i)=>s+(i.amount||0),0);
    section.innerHTML += `
    <div style="margin-top:14px;">
      <div class="perf-section-title">⏳ 받을 예정 <span style="font-size:10px;font-weight:500;color:var(--text3);margin-left:4px;">합계 ${Math.round(pendingTotal/10000)}만원</span></div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:0 14px;box-shadow:var(--shadow);">
        ${pending.map(itemHtml).join('')}
        <div style="display:flex;justify-content:space-between;padding:10px 0;">
          <span style="font-size:12px;font-weight:700;color:var(--accent);">합계</span>
          <span style="font-size:16px;font-weight:900;color:var(--accent);">${Math.round(pendingTotal/10000)}만원</span>
        </div>
      </div>
    </div>`;
  }

  if (paid.length) {
    const paidTotal = paid.reduce((s,i)=>s+(i.amount||0),0);
    section.innerHTML += `
    <div style="margin-top:14px;">
      <div class="perf-section-title">✅ 받은 것 <span style="font-size:10px;font-weight:500;color:var(--text3);margin-left:4px;">합계 ${Math.round(paidTotal/10000)}만원</span></div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:0 14px;box-shadow:var(--shadow);opacity:.85;">
        ${paid.map(itemHtml).join('')}
      </div>
    </div>`;
  }

  if (cancelled.length) {
    section.innerHTML += `
    <div style="margin-top:14px;">
      <div class="perf-section-title" style="color:var(--red);">❌ 취소/환수</div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:0 14px;opacity:.7;">
        ${cancelled.map(itemHtml).join('')}
      </div>
    </div>`;
  }

  parentEl.appendChild(section);
}

        ${ct.payPeriod||getV(ct,'납입기간')?`<span class="chip">${escHtml(ct.payPeriod||getV(ct,'납입기간'))}</span>`:''}
        <span class="chip blue">${cvs.length}개 담보</span>
        ${hasRenewCov?'<span class="chip amber">갱신형 포함</span>':''}
        ${isCard?'<span class="chip">💳 카드</span>':''}
        ${claims.length>0?`<span class="chip green">보상이력 ${claims.length}건</span>`:''}
        ${claimedCount>0?`<span class="chip gold">🏆 보상력 ${claimedCount}</span>`:''}
        ${memoCount>0?`<span class="chip blue">💬 담보메모 ${memoCount}</span>`:''}
      </div>
    </div>`;
  }).join('');
  document.getElementById('detail-content').innerHTML = html;
};

// ── 고지의무 체크 토글 ──
window.toggleNoticeItem = async function(custId, noticeId, itemId) {
  const c = getCust(custId); if(!c) return;
  const noticeResults = {...(c.noticeResults||{})};
  const key = noticeId+'_'+itemId;
  const cur = noticeResults[key];
  // 미확인 → 통과 → 미통과 → 미확인 순환
  noticeResults[key] = cur==='pass' ? 'fail' : cur==='fail' ? undefined : 'pass';
  if(noticeResults[key]===undefined) delete noticeResults[key];
  try {
    await updateDoc(doc(db,'customers',custId),{noticeResults});
    c.noticeResults = noticeResults;
    // 화면 갱신
    showDetail(custId, true);
  } catch(e) { showToast('❌ 저장 실패: '+e.message); }
};
window.copyDetailText = function(text, label) {
  navigator.clipboard.writeText(text)
    .then(() => showToast(`✅ ${label} 복사됐어요!`))
    .catch(() => showToast('❌ 복사 실패'));
};

// ── 특이사항 / 메모 입력 ──
window.onCustMemoInput = function(custDocId) {
  const saveBtn  = document.getElementById('memo-save-btn-'+custDocId);
  const copyBtn  = document.getElementById('memo-copy-inline-'+custDocId);
  const statusEl = document.getElementById('memo-status-'+custDocId);
  const val = document.getElementById('memo-ta-'+custDocId)?.value||'';
  if (saveBtn)  saveBtn.style.display  = 'inline-flex';
  if (copyBtn)  copyBtn.style.display  = val ? 'inline-flex' : 'none';
  if (statusEl) statusEl.textContent   = '저장되지 않은 변경사항';
};

window.saveCustMemo = async function(custDocId) {
  const ta       = document.getElementById('memo-ta-'+custDocId);
  const saveBtn  = document.getElementById('memo-save-btn-'+custDocId);
  const statusEl = document.getElementById('memo-status-'+custDocId);
  if (!ta) return;
  const val = ta.value.trim();

  if (saveBtn)  { saveBtn.textContent = '저장 중…'; saveBtn.disabled = true; }
  if (statusEl) statusEl.textContent = '';

  try {
    await updateDoc(doc(db, 'customers', custDocId), { memo: val });
    // 로컬 캐시도 업데이트
    const cust = customers.find(c => (c._docId||c.id) === custDocId);
    if (cust) cust.memo = val;

    if (saveBtn)  { saveBtn.textContent = '💾 저장'; saveBtn.disabled = false; saveBtn.style.display = 'none'; }
    if (statusEl) { statusEl.textContent = '✓ 저장됐어요'; statusEl.style.color = 'var(--green)'; }
    showToast('✅ 메모가 저장됐어요.');
    setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 3000);
  } catch(e) {
    if (saveBtn)  { saveBtn.textContent = '💾 저장'; saveBtn.disabled = false; }
    if (statusEl) { statusEl.textContent = '❌ 저장 실패'; statusEl.style.color = 'var(--red)'; }
    showToast('❌ 저장 실패: '+e.message);
  }
};

// ── 계약 상세 (풀스크린) ──
window.openContractScreen = function(custId, ctId, skipHistory) {
  currentSheetCustId = custId;
  currentSheetCtId = ctId;
  const ok = renderContractScreen(custId, ctId);
  if (ok === false) return;
  showScreen('contract');
  if (!skipHistory) history.pushState({view:'contract', custId, ctId}, '');
};

function renderContractScreen(custId, ctId) {
  const c = getCust(custId);
  if (!c) { console.warn('고객 없음:', custId); return false; }

  const contracts = c.contracts||[];
  let ct = contracts.find(x => x.id === ctId);

  // id로 못 찾으면 ct_idx_ 패턴으로 index 찾기
  if (!ct && ctId && ctId.startsWith('ct_idx_')) {
    const idx = parseInt(ctId.replace('ct_idx_',''));
    if (!isNaN(idx) && contracts[idx]) {
      ct = contracts[idx];
      ct.id = ctId;
    }
  }

  // 그래도 없으면 id 없는 첫 번째 계약이라도 찾기
  if (!ct) {
    ct = contracts.find(x => !x.id) || contracts[0];
    if (ct && !ct.id) ct.id = ctId;
  }

  if (!ct) { console.warn('계약 없음:', ctId); return false; }
  const rj = ct.rawJson||{};
  const company = ct.company||rj.보험사||'';
  const product = ct.product||rj.상품명||'';
  const cvs = getCoverages(ct);
  const refunds = ct.refunds||rj.해약환급금||[];
  const claims = ct.claims||[];
  const payMethod = ct.payMethod||rj.납입방법||'';
  const isCard = payMethod.includes('카드');
  const coverageMeta = ct.coverageMeta||[];

  let html = '';

  // 기본 정보
  const ctSafeId = ctId.replace(/[^a-zA-Z0-9]/g,'_');
  const cardCo = ct.cardCompany||rj.카드사||'';
  const cardNo = ct.cardLast4||rj.카드끝4자리||'';
  const cardHolder = ct.cardHolder||rj.카드명의||'';

  html += `<div class="sec-label" style="margin-top:0">계약 정보</div>
  <div class="info-grid">
    ${ic('보험사',company)}${ic('상품명',product)}
    ${ic('계약자',c.name||rj.계약자)}${ic('피보험자',rj.피보험자||c.name||'')}
    ${icEdit('계약일', (ct.startDate||rj.계약일||'미입력') + (ct.dateEstimated?' (발행일 추정)':''), `toggleDateEdit('${custId}','${ctId}','${ctSafeId}')`)}
    ${ic('보험기간',ct.expiryDate||rj.보험기간)}${ic('납입기간',ct.payPeriod||rj.납입기간)}
    ${icEdit('납입방법', payMethod||'미입력', `togglePayEdit('${custId}','${ctId}','${ctSafeId}')`)}
    ${ic('월 보험료',ct.premium?fmt(ct.premium):rj.월보험료)}
    ${ic('심사유형',rj.심사유형)}${ic('해약환급금형태',rj.해약환급금형태)}${ic('상해급수',rj.상해급수)}
  </div>

  <!-- 납입방법 편집 패널 -->
  <div id="pay-edit-${ctSafeId}" style="display:none">
    <div class="pay-edit-panel">
      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;">납입방법 변경</div>
      <div class="pay-method-opts">
        <button class="pay-opt-btn ${!isCard?'active':''}" id="popt-월납-${ctSafeId}" onclick="onPayOptChange('${ctSafeId}','월납')">📆 월납</button>
        <button class="pay-opt-btn ${isCard?'active-card':''}" id="popt-카드-${ctSafeId}" onclick="onPayOptChange('${ctSafeId}','카드납')">💳 카드납</button>
        <button class="pay-opt-btn" id="popt-자동-${ctSafeId}" onclick="onPayOptChange('${ctSafeId}','자동이체')">🏦 자동이체</button>
      </div>
      <!-- 카드 상세 (카드납 선택 시) -->
      <div id="pay-card-fields-${ctSafeId}" style="${isCard?'':'display:none'}">
        <div class="pay-card-fields">
          <div class="pay-field-row">
            <input class="pay-field-input" id="pay-cardco-${ctSafeId}" placeholder="카드사 (예: 삼성카드)" value="${escHtml(cardCo)}"/>
            <input class="pay-field-input" style="max-width:110px;" id="pay-cardno-${ctSafeId}" placeholder="끝 4자리" maxlength="4" value="${escHtml(cardNo)}"/>
          </div>
          <input class="pay-field-input" id="pay-cardholder-${ctSafeId}" placeholder="카드 명의 (예: 홍길동)" value="${escHtml(cardHolder)}"/>
        </div>
      </div>
      <div class="edit-actions">
        <button class="edit-save" onclick="savePayMethod('${custId}','${ctId}','${ctSafeId}')">저장</button>
        <button class="edit-cancel" onclick="document.getElementById('pay-edit-${ctSafeId}').style.display='none'">취소</button>
      </div>
    </div>
  </div>

  <!-- 계약일 편집 패널 -->
  <div id="date-edit-${ctSafeId}" style="display:none">
    <div class="pay-edit-panel">
      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;">계약일 수정</div>
      <input type="date" id="date-input-${ctSafeId}" value="${(()=>{const d=String(ct.startDate||rj.계약일||'').match(/(\d{4})[.\-\/](\d{1,2})[.\-\/]?(\d{1,2})?/);return d?`${d[1]}-${String(d[2]).padStart(2,'0')}-${String(d[3]||'01').padStart(2,'0')}`:'';})()}"
        style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);outline:none;box-sizing:border-box;"/>
      ${ct.dateEstimated?'<div style="font-size:11px;color:var(--amber);margin-top:6px;">⚠️ 현재 발행일로 추정된 날짜예요. 실제 계약일로 수정하면 추정 표시가 사라져요.</div>':''}
      <div class="edit-actions">
        <button class="edit-save" onclick="saveContractDate('${custId}','${ctId}','${ctSafeId}')">저장</button>
        <button class="edit-cancel" onclick="document.getElementById('date-edit-${ctSafeId}').style.display='none'">취소</button>
      </div>
    </div>
  </div>`;

  if (isCard && (cardCo||cardNo||cardHolder)) {
    html += `<div class="card-box" id="cardbox-${ctSafeId}"><div class="card-box-icon">💳</div><div class="card-box-info"><div class="card-box-company">${escHtml(cardCo||'신용카드')} ${cardNo?'****'+escHtml(cardNo):''}</div>${cardHolder?`<div class="card-box-detail">명의: ${escHtml(cardHolder)}</div>`:''}</div></div>`;
  } else if (isCard) {
    html += `<div class="card-box" id="cardbox-${ctSafeId}"><div class="card-box-icon">💳</div><div class="card-box-info"><div class="card-box-company">${escHtml(rj.카드사||'신용카드')} ${rj.카드끝4자리?'****'+escHtml(rj.카드끝4자리):''}</div>${rj.카드명의?`<div class="card-box-detail">명의: ${escHtml(rj.카드명의)}</div>`:''}</div></div>`;
  }
  if (rj.납입면제조건) {
    html += `<div style="background:var(--green-light);border:1px solid #86EFAC;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--green);">✅ 납입면제: ${escHtml(rj.납입면제조건)}</div>`;
  }
  if (rj.컨설턴트) {
    html += `<div style="font-size:12px;color:var(--text2);margin-bottom:14px;">📞 모집인: ${escHtml(rj.컨설턴트)} ${rj.컨설턴트연락처?'('+escHtml(rj.컨설턴트연락처)+')':''} ${rj.소속지점?'· '+escHtml(rj.소속지점):''}</div>`;
  }

  // 담보 목록
  if (cvs.length) {
    html += `<div class="divider"></div><div class="sec-label">🛡 담보 목록 (${cvs.length}개)</div>`;
    html += cvs.map((cv,idx) => {
      const name = cv.name||cv.담보명||'';
      const amt = cv.amount||cv.보장금액||'';
      const prem = cv.premium||cv.담보보험료||'';
      const renew = cv.renew||cv.갱신여부||'';
      const exemp = cv.exemption||cv.면책기간||'';
      const note = cv.note||cv.기타조건||'';
      const reduction = cv['1년내감액']||'';
      const paymentCond = cv.paymentCondition||cv.지급사유||'';
      const levels = cv.amountLevels||[];
      const isRenewCov = renew.includes('갱신형');
      const meta = coverageMeta[idx]||{};
      const claimed = meta.claimed||false;
      const memo = meta.memo||'';
      const claimNote = meta.claimNote||'';
      const claimDate = meta.claimDate||'';
      const sheetId = ctId.replace(/[^a-zA-Z0-9]/g,'_');

      // 상단 우측: 갱신형/보험료 칩
      const topRightChips = [
        renew ? `<span class="chip ${isRenewCov?'amber':''}" style="font-size:10px">${escHtml(renew)}</span>` : '',
        isRenewCov&&cv.갱신주기 ? `<span class="chip" style="font-size:10px">${cv.갱신주기}년갱신</span>` : '',
        isRenewCov&&cv.갱신종료나이 ? `<span class="chip" style="font-size:10px">최대${cv.갱신종료나이}세</span>` : '',
        prem ? `<span class="chip" style="font-size:10px">${escHtml(prem)}</span>` : '',
      ].filter(Boolean).join('');

      // 상세 내용 (클릭 시 펼치기)
      const detailRows = [
        paymentCond ? `<div class="dambo-detail-row"><strong>지급사유</strong><div>${escHtml(paymentCond)}</div></div>` : '',
        levels.length ? `<div class="dambo-detail-row"><strong>보장단계</strong><div>${levels.map(l=>`${escHtml(l.label||'')}: ${escHtml(l.amount||'')}`).join(' / ')}</div></div>` : '',
        exemp ? `<div class="dambo-detail-row"><strong>면책기간</strong><div>${escHtml(exemp)}</div></div>` : '',
        reduction ? `<div class="dambo-detail-row"><strong>1년내감액</strong><div>${escHtml(reduction)}</div></div>` : '',
        note ? `<div class="dambo-detail-row"><strong>기타조건</strong><div>${escHtml(note)}</div></div>` : '',
      ].filter(Boolean).join('');

      return `<div class="dambo-card${claimed?' has-claimed':''}${memo?' has-memo':''}" id="dc-${sheetId}-${idx}">
        <!-- 상단: 담보명 + 갱신형/보험료 -->
        <div class="dambo-top" onclick="toggleDamboDetail('${sheetId}',${idx})">
          <div class="dambo-name">${cv.바로보장?'<span class="chip blue" style="margin-right:4px;font-size:10px">바로보장</span>':''}${escHtml(name)}</div>
          ${topRightChips ? `<div class="dambo-top-meta">${topRightChips}</div>` : ''}
        </div>
        <!-- 보장금액 + 상세보기 힌트 -->
        <div class="dambo-amt-row">
          <div class="dambo-amt">${escHtml(amt)}${cv.isDaily?'<span style="font-size:10px;color:var(--text3);margin-left:2px">/일</span>':''}</div>
          ${detailRows ? '<div class="dambo-expand-hint" id="dhint-'+sheetId+'-'+idx+'">▼ 상세</div>' : ''}
        </div>
        <!-- 상세 내용 (접기/펼치기) -->
        ${detailRows ? `<div class="dambo-detail" id="ddet-${sheetId}-${idx}" style="display:none">${detailRows}</div>` : ''}
        <!-- 메모/보상력 표시 칩 -->
        ${(claimed||memo) ? `<div class="dambo-meta" style="margin-top:4px">
          ${claimed?'<span class="chip gold">🏆 보상력</span>':''}
          ${memo?'<span class="chip blue">💬 메모</span>':''}
        </div>` : ''}
        ${memo?`<div class="dambo-memo-text">💬 ${escHtml(memo)}</div>`:''}
        ${claimed&&claimNote?`<div class="dambo-claim-note">🏆 ${claimDate?escHtml(claimDate)+' · ':''}${escHtml(claimNote)}</div>`:''}
        <!-- 통합 메모 버튼 -->
        <div class="dambo-btn-wrap">
          <button class="dambo-btn-main ${(memo||claimed)?'active':''}" onclick="toggleDamboEdit('${sheetId}',${idx})">
            💬 메모${claimed?' · 🏆':''}
          </button>
          ${claimed ? `<div class="dambo-claimed-badge">🏆 보상력</div>` : ''}
        </div>
        <!-- 통합 편집 패널 -->
        <div class="dambo-edit" id="de-${sheetId}-${idx}">
          <!-- 보상력 섹션 -->
          <div class="dambo-edit-section">
            <div class="dambo-edit-title" style="color:var(--gold)">🏆 보상력</div>
            <label class="claim-checkbox-row">
              <input type="checkbox" id="dcb-${sheetId}-${idx}" ${claimed?'checked':''} onchange="toggleClaimFields('${sheetId}',${idx})"/>
              <span class="claim-checkbox-label">보상력 등록</span>
            </label>
            <div class="claim-fields" id="dcf-${sheetId}-${idx}" style="${claimed?'':'display:none'}">
              <input class="claim-field-input" id="dcd-${sheetId}-${idx}" placeholder="보상일 (예: 2024-03)" value="${escHtml(claimDate)}"/>
              <textarea class="claim-field-ta" id="dcn-${sheetId}-${idx}" placeholder="보상 내용, 금액 등">${escHtml(claimNote)}</textarea>
            </div>
          </div>
          <!-- 메모 섹션 -->
          <div class="dambo-edit-section">
            <div class="dambo-edit-title" style="color:var(--text3)">💬 담보 메모</div>
            <textarea id="dt-${sheetId}-${idx}" placeholder="담보 코드, 보장 설명, 참고사항" style="width:100%;padding:9px 12px;border:1.5px solid var(--accent);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;resize:vertical;min-height:60px;outline:none;background:var(--surface);line-height:1.5;">${escHtml(memo)}</textarea>
          </div>
          <div class="edit-actions">
            <button class="edit-save" onclick="saveDamboMeta('${custId}','${ctId}',${idx},'${sheetId}')">저장</button>
            <button class="edit-cancel" onclick="closeDamboEdit('${sheetId}',${idx})">취소</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  // 해약환급금 (접기/펼치기)
  if (refunds.length) {
    html += `<div class="divider"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <div class="sec-label" style="margin:0">💰 해약환급금</div>
      <button class="refund-toggle-btn" id="refund-btn-${ctId}" onclick="toggleRefunds('${ctId}')">펼치기 ▼</button>
    </div>
    <div id="refund-wrap-${ctId}" style="display:none">
      <div class="refund-wrap"><table>
        <thead><tr><th style="text-align:left">경과</th><th>나이</th><th>납입누계</th><th>환급금</th><th>환급률</th></tr></thead>
        <tbody>${refunds.map(r=>{
          const isMile = r.경과&&(r.경과.includes('납입완료')||r.경과.match(/^(20년|30년)($|[^0-9])/));
          return `<tr class="${isMile?'milestone':''}"><td>${escHtml(r.경과||'')}</td><td style="text-align:center">${escHtml(String(r.나이||''))}</td><td>${escHtml(r.납입누계||'-')}</td><td>${escHtml(r.환급금||'-')}</td><td>${escHtml(r.환급률||'-')}</td></tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>`;
  }

  // 계약전 알릴의무 (고지 조건 스냅샷)
  {
    const nt = ct.notice;
    const hasNotice = nt && (nt.items||[]).length;
    const hitCount = hasNotice ? nt.items.filter(x=>x.checked).length : 0;
    html += `<div class="divider"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <div class="sec-label" style="margin:0">📋 알릴의무(고지사항)</div>
      ${hasNotice
        ? `<div style="display:flex;gap:6px;align-items:center;">
            ${hitCount>0?`<span class="chip" style="font-size:10px;background:var(--amber-light);color:var(--amber);">해당 ${hitCount}건</span>`:'<span class="chip" style="font-size:10px;">해당 없음</span>'}
            <button class="refund-toggle-btn" onclick="openNoticeEditor('${custId}','${ctId}')">수정 ✏️</button>
           </div>`
        : `<button class="refund-toggle-btn" onclick="openNoticeEditor('${custId}','${ctId}')">+ 추가</button>`
      }
    </div>`;
    if (hasNotice) {

function getDamboCoverageMeta(ct, idx) {
  return (ct.coverageMeta||[])[idx]||{memo:'',claimed:false,claimNote:'',claimDate:''};
}

async function saveOneCoverageMeta(custId, ctId, idx, updates) {
  const c = getCust(custId);
  const ct = (c.contracts||[]).find(x=>x.id===ctId);
  if (!ct) return;
  const cvs = getCoverages(ct);
  const meta = ct.coverageMeta ? [...ct.coverageMeta] : cvs.map(()=>({}));
  while (meta.length < cvs.length) meta.push({});
  meta[idx] = {...(meta[idx]||{}), ...updates};
  const updatedContracts = (c.contracts||[]).map(x=>x.id===ctId?{...x,coverageMeta:meta}:x);
  await updateDoc(doc(db,'customers',custId),{contracts:updatedContracts});
  const ci = customers.findIndex(x=>(x._docId||x.id)===custId);
  if (ci>=0) customers[ci].contracts = updatedContracts;
}

      updated.cardHolder = cardHolder;

};
window.showTab = function(tab, skipHistory) {

  }

// ── 유틸 ──
function getCust(id) { return customers.find(x=>(x._docId||x.id)===id); }

// 계약 찾기 (id 없는 기존 계약은 ct_idx_N 폴백)
function findContract(c, ctId) {
  const list = c.contracts||[];
  let ct = list.find(x=>x.id===ctId);
  if (!ct && ctId && ctId.startsWith('ct_idx_')) {
    const idx = parseInt(ctId.replace('ct_idx_',''));
    if (!isNaN(idx) && list[idx]) ct = list[idx];
  }
  return ct;
}
// 계약 업데이트 (id 매칭 우선, 없으면 ct_idx 폴백)
function updateContractInList(c, ctId, updater) {
  const list = c.contracts||[];
  // 먼저 id로 정확히 매칭 시도
  const hasIdMatch = list.some(ct=>ct.id===ctId);
  if (hasIdMatch) return list.map(ct=> ct.id===ctId ? updater(ct) : ct);
  // id 매칭 없으면 ct_idx_N 인덱스로
  if (ctId && ctId.startsWith('ct_idx_')) {
    const idx = parseInt(ctId.replace('ct_idx_',''));
    return list.map((ct,i)=> i===idx ? updater(ct) : ct);
  }
  return list;
}

  const sel = document.getElementById(`nedit-sel-${ctId}`);

  const ct = findContract(c, ctId);

  const prevChecked = {};

  }

  box.innerHTML = `

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;align-items:stretch;">
    ${(notice.items||[]).map((item,i)=>{
      const checked = !!prevChecked[item.label];
      return `

        <span style="font-size:12px;font-weight:600;color:var(--text2);line-height:1.25;">${escHtml(item.label||'')}</span>
      </label>`;
    }).join('')}
    </div>
    <textarea id="nedit-memo-${ctId}" class="form-textarea" placeholder="고지 관련 메모 (선택)" style="min-height:46px;font-size:12px;margin-top:8px;">${escHtml(existing?.memo||'')}</textarea>`;
};

window.saveNoticeToContract = async function(custId, ctId) {
  const sel = document.getElementById(`nedit-sel-${ctId}`);
  if (!sel || !sel.value) { alert('고지의무를 선택해주세요.'); return; }
  const notice = noticesCache.find(n=>n._id===sel.value);
  if (!notice) return;

  const checks = document.querySelectorAll(`.nedit-check-${ctId}`);
  const items = (notice.items||[]).map((item,i)=>{
    const cb = [...checks].find(c=>+c.dataset.idx===i);
    return { label:item.label||'', category:item.category||'', detail:item.detail||null, checked: cb?cb.checked:false };
  });
  const memo = document.getElementById(`nedit-memo-${ctId}`)?.value.trim() || '';

  const snapshot = {
    noticeId: notice._id,
    company: notice.company||'',
    product: notice.product||'',
    title: notice.title||'',
    items, memo,
    recordedAt: new Date().toISOString(),
  };

  const c = getCust(custId);
  const updatedContracts = updateContractInList(c, ctId, ct => ({...ct, notice: snapshot}));
  try {
    await updateDoc(doc(db,'customers',custId),{contracts: updatedContracts});
    const ci = customers.findIndex(x=>(x._docId||x.id)===custId);
    if (ci>=0) customers[ci].contracts = updatedContracts;
    renderContractScreen(custId, ctId);
  } catch(e) { alert('저장 실패: '+e.message); }
};

window.deleteNoticeFromContract = async function(custId, ctId) {
  if (!confirm('이 계약의 고지 조건을 삭제할까요?')) return;
  const c = getCust(custId);
  const updatedContracts = updateContractInList(c, ctId, ct => {
    const {notice, ...rest} = ct;
    return rest;
  });
  try {
    await updateDoc(doc(db,'customers',custId),{contracts: updatedContracts});
    const ci = customers.findIndex(x=>(x._docId||x.id)===custId);
    if (ci>=0) customers[ci].contracts = updatedContracts;
    renderContractScreen(custId, ctId);
  } catch(e) { alert('삭제 실패: '+e.message); }
};
function getV(ct,key) { return ct.rawJson?.[key]||''; }
function getCoverages(ct) { return ct.coverages||ct.rawJson?.담보목록||[]; }
function isLife(s) { return /생명|생보|라이프|한화생|삼성생|교보생|흥국생|동양생|미래에셋생|푸본현대생|처브라이프|AIA|DB생명|KDB생명|ABL생명|DGB생명|iM라이프|메트라이프|신한라이프|카카오페이생명/.test(s||''); }
function isRenew(cv) { return /갱신형/.test(cv.renew||cv.갱신여부||''); }
function fmt(n) { return Number(String(n).replace(/,/g,'')).toLocaleString()+'원'; }
function ic(k,v) { if(!v) return ''; const long = ['상품명','특이사항','납입면제조건'].includes(k)||String(v).length>14; return `<div class="info-cell${long?' full':''}"><div class="info-key">${k}</div><div class="info-val">${escHtml(String(v))}</div></div>`; }
function icEdit(k,v,editFn) { return `<div class="info-cell info-cell-editable" style="position:relative;"><div class="info-key">${k}</div><div class="info-val">${escHtml(String(v||''))}</div><button class="info-edit-btn" onclick="${editFn}" title="편집">✏️</button></div>`; }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showError(msg) { document.getElementById('loading-screen').style.display='none'; document.getElementById('error-msg').innerHTML=msg.replace(/\n/g,'<br>'); document.getElementById('error-screen').classList.add('show'); }

init();
